<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 560" role="img"><title>Brief node</title><desc>The verbatim container and its actions</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4e5969" stroke-width="1.6"/></marker></defs><rect x="210" y="40" width="260" height="52" rx="8" fill="#f7f8fa" stroke="#86909c" stroke-width="1.4"/><text x="340.0" y="62" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Brief card</text><text x="340.0" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">holds YOUR words — never rewritten</text><rect x="40" y="236" width="300" height="52" rx="8" fill="#e8f3ff" stroke="#3491fa" stroke-width="1.4"/><text x="190.0" y="258" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Develop (opt-in)</text><text x="190.0" y="276" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">one cinematic prompt</text><line x1="340" y1="92" x2="190" y2="230" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="380" y="236" width="300" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="530.0" y="258" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Cast &amp; World</text><text x="530.0" y="276" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">plates from the brief</text><line x1="340" y1="92" x2="530" y2="230" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="328" width="300" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="190.0" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Storyboard</text><text x="190.0" y="368" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">divide into shot cards</text><line x1="340" y1="92" x2="190" y2="322" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="380" y="328" width="300" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="530.0" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Floor plan</text><text x="530.0" y="368" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">the scene blocking map</text><line x1="340" y1="92" x2="530" y2="322" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="420" width="300" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="190.0" y="442" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Split into Shots</text><text x="190.0" y="460" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">sequential ≤15s cards</text><line x1="340" y1="92" x2="190" y2="414" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="380" y="420" width="300" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="530.0" y="442" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">New Shot</text><text x="530.0" y="460" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">one card, brief verbatim</text><line x1="340" y1="92" x2=