<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 402" role="img"><title>Inspiration Board</title><desc>Prompt to reference imagery</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4e5969" stroke-width="1.6"/></marker></defs><rect x="210" y="40" width="260" height="52" rx="8" fill="#f7f8fa" stroke="#86909c" stroke-width="1.4"/><text x="340.0" y="62" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Prompt + optional refs</text><text x="340.0" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">ticked board images only</text><line x1="340" y1="92" x2="340" y2="126" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><text x="352" y="113" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">one call</text><rect x="210" y="130" width="260" height="52" rx="8" fill="#e8f3ff" stroke="#3491fa" stroke-width="1.4"/><text x="340.0" y="152" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Seed 2.0 Pro — plan</text><text x="340.0" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">N distinct content-aware descriptors</text><line x1="340" y1="182" x2="340" y2="216" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><rect x="210" y="220" width="260" height="52" rx="8" fill="#e6fffb" stroke="#0fc6c2" stroke-width="1.4"/><text x="340.0" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Seedream ×N</text><text x="340.0" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-