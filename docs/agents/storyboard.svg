<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 492" role="img"><title>Storyboard agent</title><desc>Text-first shot division</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4e5969" stroke-width="1.6"/></marker></defs><rect x="210" y="40" width="260" height="52" rx="8" fill="#f7f8fa" stroke="#86909c" stroke-width="1.4"/><text x="340.0" y="62" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Brief</text><text x="340.0" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">verbatim</text><line x1="340" y1="92" x2="340" y2="126" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><text x="352" y="113" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">wording preserved</text><rect x="210" y="130" width="260" height="52" rx="8" fill="#e8f3ff" stroke="#3491fa" stroke-width="1.4"/><text x="340.0" y="152" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Seed 2.0 Pro — divide</text><text x="340.0" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">ONE call → shot list</text><line x1="340" y1="182" x2="340" y2="216" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><text x="352" y="203" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">editable free, dbl-click</text><rect x="210" y="220" width="260" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="340.0" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Text shot cards</text><text x="340.0" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">framing · angle · move · duration · casting</text><line x1="340" y1="272" x2="340" y2="306" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><text x="352" y="293" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">explicit taps only</text><rect x="210" y="310" width="260" height="52" rx="8" fill="#e6fffb" stroke="#0fc6c2" stroke-width="1.4"/><text x="340.0" y="332" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Seedream stills (opt-in)</text><text x="340.0" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">per card or Render-all — division never renders</text><line x1="340" y1="362" x2="340" y2="396" stroke="#4e5969" stroke-width="1.5" marker-end="url(#arr)"/><text x="352" y="383" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">per keyframe</text><rect x="210" y="400" width="260" height="52" rx="8" fill="#fff7e8" stroke="#b06f10" stroke-width="1.4"/><text x="340.0" y="422" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1d2129">Promote → SHOT card</text><text x="340.0" y="440" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">still rides as the [Image 1] anchor lock</text><text x="40" y="30" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4e5969">Chat revisions are TEXT-only; stale stills get an amber chip.</text></svg>