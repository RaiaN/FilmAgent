<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="art.css">
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { SCENES } from './scenes.js';
  const name = new URLSearchParams(location.search).get('s') || 'hero';
  const stage = document.getElementById('stage');
  const scene = SCENES[name];
  stage.className = `stage ${scene.size || 'agent'}`;
  stage.innerHTML = scene.html();
  document.fonts.ready.then(() => { window.__ready = { w: stage.offsetWidth, h: stage.offsetHeight }; });
</script>
</body>
</html>
