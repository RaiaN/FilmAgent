<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="686" viewBox="0 0 680 686" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ModelArk Assets API — whole flow, end to end</title>
  <desc>Vertical flow: a user provides media; your server ensures a fetchable URL (staging local files to TOS), calls CreateAsset (auto-creating the group if missing), polls GetAsset until Active to get a permanent asset id, then stores it and references it as asset:// in downstream Seedance or Animate generation.</desc>

  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1f2328; }
    .ts { font-size: 12px; font-weight: 400; fill: #656d76; }
    .box rect, rect.box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .c-blue rect { fill: #ddeaff; stroke: #4a86e8; stroke-width: 1; }
    .c-blue .th, .c-blue .ts { fill: #0a3d7a; }
    .c-purple rect { fill: #efe3fb; stroke: #8250df; stroke-width: 1; }
    .c-purple .th, .c-purple .ts { fill: #4527a0; }
    .arr { stroke: #6e7781; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .leader { stroke: #afb8c1; stroke-width: 0.75; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      .th { fill: #e6edf3; }
      .ts { fill: #9198a1; }
      rect.box { fill: #1c2128; stroke: #3d444d; }
      .c-blue rect { fill: #12325c; stroke: #4a86e8; }
      .c-blue .th, .c-blue .ts { fill: #cfe0ff; }
      .c-purple rect { fill: #2f1f52; stroke: #a371f7; }
      .c-purple .th, .c-purple .ts { fill: #e6d6ff; }
      .arr { stroke: #8b949e; }
      .leader { stroke: #5a636d; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#6e7781" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- ============ PART A · REGISTER (blue) ============ -->

  <!-- N1 input (neutral) -->
  <rect class="box" x="200" y="50" width="280" height="42" rx="8"/>
  <text class="th" x="340" y="74" text-anchor="middle">User provides media</text>
  <text class="ts" x="340" y="88" text-anchor="middle">public URL or local file</text>
  <line class="arr" x1="340" y1="92" x2="340" y2="116"/>

  <!-- N2 ensure URL (blue) -->
  <g class="c-blue"><rect x="200" y="116" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="140" text-anchor="middle">Ensure a fetchable URL</text>
    <text class="ts" x="340" y="154" text-anchor="middle">stage local files to TOS · presigned GET</text>
  </g>
  <line class="arr" x1="340" y1="158" x2="340" y2="182"/>

  <!-- N3 CreateAsset (blue) + group side-node -->
  <g class="c-blue"><rect x="200" y="182" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="206" text-anchor="middle">CreateAsset</text>
    <text class="ts" x="340" y="220" text-anchor="middle">signed AK/SK</text>
  </g>
  <line class="arr" x1="480" y1="203" x2="500" y2="203" style="stroke-dasharray:5 4"/>
  <g class="c-blue"><rect x="500" y="182" width="136" height="42" rx="8"/>
    <text class="ts" x="568" y="201" text-anchor="middle">group missing →</text>
    <text class="ts" x="568" y="216" text-anchor="middle">create + retry</text>
  </g>
  <text class="ts" x="352" y="240" text-anchor="start">assetId · Processing</text>
  <line class="arr" x1="340" y1="224" x2="340" y2="248"/>

  <!-- N4 poll (blue) + self loop -->
  <g class="c-blue"><rect x="200" y="248" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="272" text-anchor="middle">Poll GetAsset</text>
    <text class="ts" x="340" y="286" text-anchor="middle">every POLL_INTERVAL_MS</text>
  </g>
  <path class="arr" d="M480,262 H512 V278 H482" style="stroke-dasharray:5 4"/>
  <text class="ts" x="518" y="273" text-anchor="start">still Processing</text>
  <text class="ts" x="352" y="306" text-anchor="start">Active</text>
  <line class="arr" x1="340" y1="290" x2="340" y2="314"/>

  <!-- N5 asset ready (blue, milestone) -->
  <g class="c-blue"><rect x="200" y="314" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="338" text-anchor="middle">asset://id ready</text>
    <text class="ts" x="340" y="352" text-anchor="middle">permanent · survives URL expiry</text>
  </g>
  <line class="arr" x1="340" y1="356" x2="340" y2="396"/>

  <!-- divider -->
  <line class="leader" x1="60" y1="378" x2="620" y2="378"/>
  <text class="ts" x="340" y="373" text-anchor="middle">asset stored — now reuse it</text>

  <!-- ============ PART B · CONSUME (purple) ============ -->

  <!-- N6 store (neutral) -->
  <rect class="box" x="200" y="396" width="280" height="42" rx="8"/>
  <text class="th" x="340" y="420" text-anchor="middle">Store assetId</text>
  <text class="ts" x="340" y="434" text-anchor="middle">on your image / entity</text>
  <line class="arr" x1="340" y1="438" x2="340" y2="462"/>

  <!-- N7 reference (purple) -->
  <g class="c-purple"><rect x="200" y="462" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="486" text-anchor="middle">Reference asset://id</text>
    <text class="ts" x="340" y="500" text-anchor="middle">in the image_url slot</text>
  </g>
  <line class="arr" x1="340" y1="504" x2="340" y2="528"/>

  <!-- N8 resolve (purple) -->
  <g class="c-purple"><rect x="200" y="528" width="280" height="42" rx="8"/>
    <text class="th" x="340" y="552" text-anchor="middle">Seedance / Animate resolves</text>
    <text class="ts" x="340" y="566" text-anchor="middle">trusted · photoreal humans pass</text>
  </g>
  <line class="arr" x1="340" y1="570" x2="340" y2="594"/>

  <!-- N9 result (neutral terminal) -->
  <rect class="box" x="200" y="594" width="280" height="42" rx="8"/>
  <text class="th" x="340" y="620" text-anchor="middle">Video / animation result</text>

  <!-- legend -->
  <text class="ts" x="340" y="664" text-anchor="middle">Blue = register the asset · Purple = use it downstream · dashed = conditional / loop</text>
</svg>
